syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Gabo-div/bingo/packages/protobuf/go/proto/user;user";

service UserService {
  rpc GetUser(Empty) returns (User);
  rpc AddPaymentMethod(PaymentMethodReq) returns (Empty);
  rpc GetPaymentMethods(Empty) returns (PaymentMethodList);
  rpc GetTransactionHistory(Empty) returns (TransactionList);
}

message Empty {
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  bool emailVerified = 4;
  string role = 5;
  bool banned = 6;
  string banReason = 7;
  string banExpires = 8;
  string image = 9;
  string createdAt = 10;
  string updatedAt = 11;
}

message PaymentMethodReq {
  string methodType = 1;
  bytes data = 2;
}

message PaymentMethodRes {
  string id = 1;
  string methodType = 2;
  bytes data = 3;
}

message Transaction {
  string id = 1;
  string methodId = 2;
  double amount = 3;
  google.protobuf.Timestamp datetime = 4;
}

message PaymentMethodList {
  repeated PaymentMethodRes methods = 1;
}

message TransactionList {
  repeated Transaction history = 1;
}
